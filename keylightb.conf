# keylightb settings
# Restart the service after editing: sudo systemctl restart keylightb
# Command-line options override these.

# Starting brightness when you type, 1-100.
# keylightb switches to whatever level you pick with Fn+Space after that.
brightness = 30

# Replace the firmware's Fn+Space levels with your own: yes or no.
# When yes, uncomment the levels you want to change below (1-100).
# Commented-out levels keep the firmware's value.
# Takes effect at your next keypress after Fn+Space.
custom_levels = no
#level1 = 20
#level2 = 75
#level3 = 100

# Seconds without typing or touchpad use before the backlight fades out.
timeout = 10

# How long fading on or off takes, in microseconds (100000 = 0.1 seconds).
fadeduration = 100000

# Whether using the touchpad turns the backlight on too: yes or no.
touchpad = yes
